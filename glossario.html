<!DOCTYPE html>
<html lang="pt">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ephico | Glossário</title>

    <link rel="stylesheet" href="css/styles.css">
    <link rel="icon" href="imagens/phiicon.ico">
  </head>

  <body>
    <div id="conteudo">
      <div id="sidebar-container"></div>

      <button onclick="topFunction()" id="topbutton" title="Voltar ao topo">↑</button>

      <header>
        <h1>Glossário</h1>
      </header>

      <main>
        <p>Todos os conceitos importantes num só lugar, por ordem alfabética.</p>

        <input type="search" id="pesquisa" class="glossario-pesquisa"
              placeholder="Pesquisar um conceito..." aria-label="Pesquisar no glossário">

        <p id="sem-resultados" hidden>Nenhum conceito encontrado.</p>

        <section id="lista-glossario">
          <p id="a-carregar">A carregar conceitos...</p>
        </section>
      </main>
    </div>

    <script src="js/sidebar.js"></script>
    <script src="js/button.js"></script>
    <script src="js/glossario.js"></script>

  </body>
</html>
